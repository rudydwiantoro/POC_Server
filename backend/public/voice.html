<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoC PTT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      :root {
        --bg: #08131d;
        --panel: #0f1f2d;
        --line: #2a4960;
        --text: #e6f0f7;
        --muted: #9bb2c2;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .top-left { display: flex; align-items: center; gap: 8px; }
      .conn-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d54c4c;
        box-shadow: 0 0 0 2px rgba(213, 76, 76, 0.18);
      }
      .conn-dot.on {
        background: #31c56b;
        box-shadow: 0 0 0 2px rgba(49, 197, 107, 0.2);
      }
      .small { font-size: 12px; color: var(--muted); }
      .status { font-size: 13px; margin-top: 8px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      select, input, button { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; }
      select, input { background: #0f2230; color: var(--text); }
      button { background: linear-gradient(90deg, #27c4a8, #2ca5c6); color: #032229; font-weight: 800; cursor: pointer; }
      .main-grid { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: start; }
      .ptt-zone { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; }
      #pttBtn {
        width: 200px; height: 200px; border-radius: 999px; border: 2px solid #7a1f1f;
        background: radial-gradient(circle at 35% 30%, #e25f5f, #ac2d2d);
        color: #fff; font-size: 18px; font-weight: 800; letter-spacing: .4px;
      }
      #pttBtn.active { border-color: #0a6f2a; background: radial-gradient(circle at 35% 30%, #4bc87a, #0b8f35); }
      .right-stack { display: flex; flex-direction: column; gap: 8px; }
      .right-stack button, .right-stack select { width: 100%; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        padding: 8px 10px;
      }
      .icon-btn i { font-size: 12px; }
      .icon-only {
        width: 42px !important;
        min-width: 42px;
        padding: 8px !important;
      }
      .icon-only i { margin: 0; font-size: 14px; }
      .icon-row {
        display: flex;
        gap: 8px;
      }
      .icon-row .icon-only {
        flex: 1;
      }
      #loginGate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #071019; z-index: 1000; }
      #loginBox { width: 340px; background: #0f1f2d; border: 1px solid #2a4960; border-radius: 12px; padding: 16px; }
      #logBox { display: none; margin-top: 10px; }
      pre { background: #0b1822; color: #d9ecff; border-radius: 8px; padding: 8px; min-height: 120px; max-height: 200px; overflow: auto; }
      #remoteAudio { display: none; }
    </style>
  </head>
  <body>
    <div id="loginGate">
      <div id="loginBox">
        <h3 style="margin:0 0 10px 0;">Login PTT</h3>
        <label>User ID</label><input id="loginUserId" value="u1" />
        <label style="margin-top:8px;">Device ID</label><input id="loginDeviceId" value="d1" />
        <button id="btnLogin" style="margin-top:10px;">Login</button>
        <div id="loginStatus" class="small" style="margin-top:8px;">Not logged in.</div>
      </div>
    </div>

    <div class="wrap">
      <div class="card">
        <div class="top">
          <div class="top-left">
            <span id="connDot" class="conn-dot"></span>
            <div>
            <div style="font-weight:800;">PTT Voice</div>
            <div id="whoami" class="small">-</div>
            </div>
          </div>
          <button id="btnLogout" class="icon-btn" style="width:auto;padding:8px 10px;" title="Logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <div class="main-grid">
          <div>
            <div class="ptt-zone">
              <button id="pttBtn" disabled>HOLD TO TALK</button>
              <div id="pttHint" class="small" style="display:none;"></div>
            </div>
            <div id="status" class="status"></div>
          </div>
          <div class="right-stack">
            <div id="channelWrap">
            <label>Channel</label>
            <select id="channelId">
              <option value="engineering">engineering</option>
              <option value="housekeeping">housekeeping</option>
              <option value="security">security</option>
              <option value="all-call">all-call</option>
            </select>
            <label>Voice Style</label>
            <select id="voiceStyle">
              <option value="clean">clean</option>
              <option value="radio">radio</option>
            </select>
            </div>
            <div class="icon-row">
              <button id="btnSpeaker" class="icon-btn icon-only" title="Enable Speaker"><i class="fa-solid fa-volume-high"></i></button>
              <button id="btnReconnect" class="icon-btn icon-only" title="Reconnect"><i class="fa-solid fa-rotate-right"></i></button>
              <button id="btnToggleLog" class="icon-btn icon-only" title="Show Log"><i class="fa-solid fa-terminal"></i></button>
            </div>
          </div>
        </div>

        <div id="logBox"><pre id="log"></pre></div>
      </div>
    </div>

    <audio id="remoteAudio" autoplay playsinline controls></audio>

    <script>
      const state = {
        token: "", ws: null, pc: null, localStream: null, outboundTrack: null, rawMicTrack: null,
        userId: "", deviceId: "", channelId: "engineering", joined: false, floorGranted: false,
        remoteUserId: null, floorHolderUserId: null, mediaRecorder: null, recordChunks: [], recordStartedAt: null,
        audioContext: null, dryGain: null, wetGain: null, highPass: null, lowPass: null, compressor: null
      };
      const iceConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
      const logEl = document.getElementById("log");
      const pttBtn = document.getElementById("pttBtn");
      const remoteAudioEl = document.getElementById("remoteAudio");

      function log(msg, obj) {
        const line = obj ? `${msg} ${JSON.stringify(obj)}` : msg;
        logEl.textContent = `${new Date().toISOString()} ${line}\n${logEl.textContent}`.slice(0, 6000);
      }
      function setConnected(on) {
        const dot = document.getElementById("connDot");
        dot.classList.toggle("on", Boolean(on));
      }
      function setStatus(t) { document.getElementById("status").textContent = t; }
      function setPttEnabled(on) {
        state.floorGranted = on;
        if (state.outboundTrack) state.outboundTrack.enabled = on;
        pttBtn.classList.toggle("active", on);
      }
      function sendWs(payload) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
        state.ws.send(JSON.stringify(payload));
      }
      async function api(path, options = {}) {
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        if (state.token) headers.Authorization = `Bearer ${state.token}`;
        const res = await fetch(path, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
        return data;
      }
      async function login(userId, deviceId) {
        const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ userId, deviceId }) });
        state.token = data.accessToken;
        state.userId = userId;
        state.deviceId = deviceId;
        localStorage.setItem("poc_voice_user_id", userId);
        localStorage.setItem("poc_voice_device_id", deviceId);
        localStorage.setItem("poc_voice_channel", document.getElementById("channelId").value);
        document.getElementById("whoami").textContent = `${userId} / ${deviceId}`;
        return data;
      }
      async function createPeerConnection() {
        if (state.pc) return state.pc;
        state.pc = new RTCPeerConnection(iceConfig);
        state.pc.onicecandidate = (event) => {
          if (!event.candidate || !state.remoteUserId) return;
          sendWs({ type: "webrtc_ice", toUserId: state.remoteUserId, candidate: event.candidate });
        };
        state.pc.ontrack = (event) => {
          remoteAudioEl.srcObject = event.streams[0];
          remoteAudioEl.muted = false;
          remoteAudioEl.volume = 1;
          remoteAudioEl.play().catch(() => log("autoplay blocked, tap Enable Speaker"));
          log("remote track attached");
        };
        return state.pc;
      }
      async function setupLocalAudio() {
        if (state.localStream) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("microphone API unavailable. open via HTTPS (or localhost), then allow mic permission");
        }
        const raw = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        state.rawMicTrack = raw.getAudioTracks()[0];
        state.audioContext = new AudioContext();
        const source = state.audioContext.createMediaStreamSource(raw);
        const dest = state.audioContext.createMediaStreamDestination();
        state.dryGain = state.audioContext.createGain();
        state.wetGain = state.audioContext.createGain();
        state.highPass = state.audioContext.createBiquadFilter();
        state.highPass.type = "highpass";
        state.lowPass = state.audioContext.createBiquadFilter();
        state.lowPass.type = "lowpass";
        state.compressor = state.audioContext.createDynamicsCompressor();
        source.connect(state.dryGain);
        source.connect(state.highPass);
        state.highPass.connect(state.lowPass);
        state.lowPass.connect(state.compressor);
        state.compressor.connect(state.wetGain);
        state.dryGain.connect(dest);
        state.wetGain.connect(dest);
        state.localStream = dest.stream;
        applyVoiceStyle(document.getElementById("voiceStyle").value);
        state.outboundTrack = state.localStream.getAudioTracks()[0];
        state.outboundTrack.enabled = false;
        const pc = await createPeerConnection();
        state.localStream.getTracks().forEach((t) => pc.addTrack(t, state.localStream));
        log("local mic ready");
      }

      function applyVoiceStyle(style) {
        if (!state.dryGain || !state.wetGain || !state.highPass || !state.lowPass || !state.compressor) return;
        if (style === "radio") {
          state.dryGain.gain.value = 0.0;
          state.wetGain.gain.value = 1.0;
          state.highPass.frequency.value = 350;
          state.lowPass.frequency.value = 3000;
          state.compressor.threshold.value = -30;
          state.compressor.ratio.value = 4;
          state.compressor.attack.value = 0.003;
          state.compressor.release.value = 0.25;
        } else {
          state.dryGain.gain.value = 1.0;
          state.wetGain.gain.value = 0.0;
          state.highPass.frequency.value = 120;
          state.lowPass.frequency.value = 7000;
          state.compressor.threshold.value = -20;
          state.compressor.ratio.value = 2;
          state.compressor.attack.value = 0.005;
          state.compressor.release.value = 0.1;
        }
        log("voice style", { style });
      }
      async function makeOffer(toUserId) {
        state.remoteUserId = toUserId;
        const pc = await createPeerConnection();
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendWs({ type: "webrtc_offer", toUserId, sdp: offer });
      }
      async function handleOffer(fromUserId, sdp) {
        state.remoteUserId = fromUserId;
        const pc = await createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendWs({ type: "webrtc_answer", toUserId: fromUserId, sdp: answer });
      }
      function pickRecorderMimeType() {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) return "audio/webm;codecs=opus";
        if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")) return "audio/webm";
        return "";
      }
      function startLocalPttRecording() {
        if (!state.localStream || !window.MediaRecorder) return;
        if (state.mediaRecorder && state.mediaRecorder.state === "recording") return;
        const mimeType = pickRecorderMimeType();
        state.recordChunks = [];
        state.mediaRecorder = mimeType ? new MediaRecorder(state.localStream, { mimeType }) : new MediaRecorder(state.localStream);
        state.recordStartedAt = Date.now();
        state.mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) state.recordChunks.push(e.data); };
        state.mediaRecorder.start();
      }
      async function stopAndUploadLocalPttRecording() {
        if (!state.mediaRecorder || state.mediaRecorder.state !== "recording") return;
        const rec = state.mediaRecorder;
        const durationMs = state.recordStartedAt ? (Date.now() - state.recordStartedAt) : null;
        await new Promise((resolve) => { rec.onstop = resolve; rec.stop(); });
        const blob = new Blob(state.recordChunks, { type: rec.mimeType || "audio/webm" });
        state.recordChunks = [];
        if (!blob.size) return;
        const base64 = await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => { const s = String(fr.result || ""); const idx = s.indexOf(","); resolve(idx >= 0 ? s.slice(idx + 1) : ""); };
          fr.onerror = reject;
          fr.readAsDataURL(blob);
        });
        try {
          await api("/api/ptt/floor/messages/upload", {
            method: "POST",
            body: JSON.stringify({ userId: state.userId, deviceId: state.deviceId, channelId: state.channelId, mimeType: blob.type || "audio/webm", audioBase64: base64, durationMs })
          });
        } catch (e) { log("upload error", { message: e.message }); }
      }
      async function connectVoice() {
        await setupLocalAudio();
        state.ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/signaling`);
        state.ws.onopen = () => {
          sendWs({ type: "join_channel", userId: state.userId, channelId: state.channelId });
          sendWs({ type: "floor_state", channelId: state.channelId });
          state.joined = true;
          pttBtn.disabled = false;
          setConnected(true);
          setStatus("");
        };
        state.ws.onclose = () => {
          state.joined = false;
          pttBtn.disabled = true;
          setConnected(false);
          setStatus("Disconnected");
        };
        state.ws.onerror = () => {
          setConnected(false);
          setStatus("Connection error");
        };
        state.ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "peer_joined" && msg.userId !== state.userId) {
            if (state.userId < msg.userId) await makeOffer(msg.userId);
          } else if (msg.type === "join_ack") {
            const peers = Array.isArray(msg.peers) ? msg.peers : [];
            for (const p of peers) if (p !== state.userId && state.userId < p) await makeOffer(p);
          } else if (msg.type === "webrtc_offer" && msg.fromUserId !== state.userId) {
            await handleOffer(msg.fromUserId, msg.sdp);
          } else if (msg.type === "webrtc_answer" && msg.fromUserId === state.remoteUserId) {
            const pc = await createPeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          } else if (msg.type === "webrtc_ice" && msg.fromUserId === state.remoteUserId && msg.candidate) {
            const pc = await createPeerConnection();
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } else if (msg.type === "floor_granted") {
            state.floorHolderUserId = msg.holder ? msg.holder.userId : null;
            setPttEnabled(Boolean(msg.holder && msg.holder.userId === state.userId));
          } else if (msg.type === "floor_released") {
            state.floorHolderUserId = null;
            setPttEnabled(false);
          } else if (msg.type === "floor_busy") {
            setPttEnabled(false);
          }
        };
      }

      async function startSession(userId, deviceId) {
        const status = document.getElementById("loginStatus");
        try {
          status.textContent = "Logging in...";
          await login(userId, deviceId);
          state.channelId = document.getElementById("channelId").value;
          document.getElementById("loginGate").style.display = "none";
          setStatus("logged in, connecting...");
          try {
            await connectVoice();
          } catch (e) {
            setConnected(false);
            setStatus(`Connect failed: ${e.message}`);
            log("connect failed after login", { message: e.message });
          }
        } catch (e) {
          status.textContent = `Login failed: ${e.message}`;
        }
      }

      pttBtn.onmousedown = async () => {
        if (!state.joined) return;
        startLocalPttRecording();
        sendWs({ type: "request_talk", userId: state.userId, deviceId: state.deviceId, channelId: state.channelId });
      };
      pttBtn.onmouseup = async () => {
        if (!state.joined) return;
        await stopAndUploadLocalPttRecording();
        sendWs({ type: "release_talk", userId: state.userId, channelId: state.channelId });
      };
      pttBtn.onmouseleave = async () => {
        if (!state.joined || !state.floorGranted) return;
        await stopAndUploadLocalPttRecording();
        sendWs({ type: "release_talk", userId: state.userId, channelId: state.channelId });
      };
      pttBtn.ontouchstart = (e) => {
        e.preventDefault();
        if (!state.joined) return;
        startLocalPttRecording();
        sendWs({ type: "request_talk", userId: state.userId, deviceId: state.deviceId, channelId: state.channelId });
      };
      pttBtn.ontouchend = async (e) => {
        e.preventDefault();
        if (!state.joined) return;
        await stopAndUploadLocalPttRecording();
        sendWs({ type: "release_talk", userId: state.userId, channelId: state.channelId });
      };

      document.getElementById("btnLogin").onclick = () => {
        const u = document.getElementById("loginUserId").value.trim();
        const d = document.getElementById("loginDeviceId").value.trim();
        startSession(u, d);
      };
      document.getElementById("btnLogout").onclick = () => {
        localStorage.removeItem("poc_voice_user_id");
        localStorage.removeItem("poc_voice_device_id");
        localStorage.removeItem("poc_voice_channel");
        location.reload();
      };
      document.getElementById("btnSpeaker").onclick = async () => {
        try { remoteAudioEl.muted = false; remoteAudioEl.volume = 1; await remoteAudioEl.play(); log("speaker enabled"); }
        catch (e) { log("speaker enable failed", { message: e.message }); }
      };
      document.getElementById("btnReconnect").onclick = async () => {
        try {
          if (state.ws) {
            try { state.ws.close(); } catch (_e) {}
            state.ws = null;
          }
          state.joined = false;
          pttBtn.disabled = true;
          setConnected(false);
          setStatus("Reconnecting...");
          await connectVoice();
        } catch (e) {
          setConnected(false);
          setStatus(`Reconnect failed: ${e.message}`);
          log("reconnect failed", { message: e.message });
        }
      };
      document.getElementById("btnToggleLog").onclick = () => {
        const b = document.getElementById("logBox");
        const hidden = b.style.display === "none";
        b.style.display = hidden ? "block" : "none";
        document.getElementById("btnToggleLog").title = hidden ? "Hide Log" : "Show Log";
      };
      document.getElementById("channelId").onchange = () => {
        state.channelId = document.getElementById("channelId").value;
        localStorage.setItem("poc_voice_channel", state.channelId);
      };
      document.getElementById("voiceStyle").onchange = () => {
        const style = document.getElementById("voiceStyle").value;
        localStorage.setItem("poc_voice_style", style);
        applyVoiceStyle(style);
      };

      (async () => {
        const params = new URLSearchParams(location.search);
        const c = localStorage.getItem("poc_voice_channel") || "engineering";
        const st = localStorage.getItem("poc_voice_style") || "clean";
        document.getElementById("channelId").value = params.get("channelId") || c;
        document.getElementById("voiceStyle").value = st;
        // When opened inside dispatcher quick-PTT panel, parent controls channel.
        if (params.get("embedded") === "1") {
          const cw = document.getElementById("channelWrap");
          if (cw) cw.style.display = "none";
        }
        const u = params.get("userId") || localStorage.getItem("poc_voice_user_id") || "";
        const d = params.get("deviceId") || localStorage.getItem("poc_voice_device_id") || "";
        if (u) document.getElementById("loginUserId").value = u;
        if (d) document.getElementById("loginDeviceId").value = d;
        if (u && d) await startSession(u, d);
      })();
    </script>
  </body>
</html>
