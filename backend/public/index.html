<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoC Login</title>
    <style>
      :root { --bg:#08141d; --panel:#0f2230; --line:#2b4b60; --text:#e8f1f7; --muted:#9bb2c2; --accent:#28c6a8; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:"Segoe UI",Tahoma,sans-serif; color:var(--text); background:var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
      .card { width:min(460px, calc(100vw - 24px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
      label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
      input, button { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px; font-size:14px; }
      input { background:#102737; color:var(--text); }
      button { margin-top:10px; background:linear-gradient(90deg,var(--accent),#2ea0cf); color:#04252f; font-weight:700; cursor:pointer; }
      .meta { color:var(--muted); font-size:12px; margin-top:8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin:0;">Login</h2>
      <div class="meta">Role-based landing otomatis: dispatcher/admin/operator.</div>
      <label for="userId">User ID</label>
      <input id="userId" value="supervisor" />
      <label for="deviceId">Device ID</label>
      <input id="deviceId" value="desk1" />
      <button id="btnLogin">Login</button>
      <div class="meta" id="status">Belum login.</div>
    </div>
    <script>
      const SESSION_KEY = "poc_dispatch_session_v1";
      function setStatus(t) { document.getElementById("status").textContent = t; }
      function goByRole(role, userId, deviceId, channelIds) {
        if (role === "dispatcher") { location.href = "/dispatcher.html"; return; }
        if (role === "admin") { location.href = "/admin.html"; return; }
        const ch = Array.isArray(channelIds) && channelIds.length ? channelIds[0] : "engineering";
        location.href = `/dispatcher-ptt.html?userId=${encodeURIComponent(userId)}&deviceId=${encodeURIComponent(deviceId)}&channelId=${encodeURIComponent(ch)}`;
      }
      async function loginAndRoute(userId, deviceId) {
        const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId, deviceId }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "login failed");
        const role = data.user ? data.user.role : "";
        localStorage.setItem(SESSION_KEY, JSON.stringify({ userId, deviceId, token: data.accessToken || "", role }));
        goByRole(role, userId, deviceId, data.user ? data.user.channelIds : []);
      }
      document.getElementById("btnLogin").onclick = async () => {
        try {
          const userId = document.getElementById("userId").value.trim();
          const deviceId = document.getElementById("deviceId").value.trim();
          setStatus("Logging in...");
          await loginAndRoute(userId, deviceId);
        } catch (e) {
          setStatus(`Login gagal: ${e.message}`);
        }
      };
      (async function autoBoot() {
        let ss = null;
        try { ss = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (_e) { ss = null; }
        if (!ss || !ss.userId || !ss.deviceId) return;
        try { await loginAndRoute(ss.userId, ss.deviceId); } catch (_e) {}
      })();
    </script>
  </body>
</html>
